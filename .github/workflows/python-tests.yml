name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r receiver/python/requirements.txt
          if [ -f simulation/python/requirements.txt ]; then
            pip install -r simulation/python/requirements.txt
          else
            echo "No simulation/python/requirements.txt yet; skipping simulation dependencies."
          fi
      - name: Run receiver tests
        run: |
          pytest -q receiver/python/tests
        env:
          PYTHONPATH: receiver/python
      - name: Run simulation tests if present
        run: |
          if [ -d simulation/python/tests ]; then
            pytest -q simulation/python/tests
          else
            echo "No simulation/python/tests directory yet; skipping simulation tests."
          fi
        env:
          PYTHONPATH: simulation/python
