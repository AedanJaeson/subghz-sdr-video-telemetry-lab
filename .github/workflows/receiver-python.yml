name: Receiver Python

on:
  pull_request:
    paths:
      - "receiver/python/**"
      - ".github/workflows/receiver-python.yml"
  push:
    branches:
      - main
    paths:
      - "receiver/python/**"
      - ".github/workflows/receiver-python.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install receiver dependencies
        working-directory: receiver/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run receiver tests
        working-directory: receiver/python
        run: pytest
